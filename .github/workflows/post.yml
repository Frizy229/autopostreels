name: Публикация рилсов

on:
  schedule:
    # Каждый час. Скрипт сам решает, пора ли публиковать (окно day_start..day_end в config.json)
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать"
        type: choice
        default: post
        options: [post, dry-run, check]

permissions:
  contents: write

concurrency:
  group: autoposter
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Запуск
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          case "${{ inputs.action || 'post' }}" in
            check)   python autoposter.py check ;;
            dry-run) python autoposter.py post --dry-run ;;
            *)       python autoposter.py post ;;
          esac

      - name: Сохранить, что опубликовано
        if: always() && (inputs.action || 'post') == 'post'
        run: |
          git config user.name "autoposter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue posted state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Автопостер: обновление очереди $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
