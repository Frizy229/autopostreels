name: Тесты

on:
  pull_request:
  push:
    branches: [main]
    paths: ["autoposter.py", "tests/**", "widget-app/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Автопостер (Instagram, TikTok, очереди, тексты)
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Виджет
        working-directory: widget-app
        run: |
          npm ci --ignore-scripts
          npm test
